# LeapVPN ad blocker: answers DNS only for devices the agent redirects here
# (devices whose lease asks for ad blocking). Everyone else keeps 1.1.1.1.
no-resolv
no-hosts
no-poll
server=1.1.1.1
server=1.0.0.1
listen-address=10.66.0.1
bind-dynamic
cache-size=10000
domain-needed
bogus-priv
# Keep filtered devices on this resolver instead of an encrypted one that bypasses it:
# Firefox's canary domain, Apple/Windows DDR discovery (_dns.resolver.arpa), and the
# DNS-over-HTTPS hosts Chrome and Edge upgrade to automatically.
local=/use-application-dns.net/
local=/resolver.arpa/
local=/cloudflare-dns.com/
local=/dns.google/
local=/dns.quad9.net/
local=/doh.opendns.com/
conf-file=/var/lib/leapvpn/blocklist.conf
